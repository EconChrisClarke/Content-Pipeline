function generateSubstackDraft(card){
  // The script is already written as Substack-ready markdown — paragraphs
  // with ![](path) image lines dropped in wherever they belong — so the
  // draft just uses it as-is instead of re-chunking it into sentences,
  // which would otherwise scramble the image placement.
  let draft = '# ' + card.title + '\n\n';
  if(card.subtitle) draft += '*' + card.subtitle + '*\n\n';
  draft += (card.script||'').trim() || '(No script text yet — write the script first, then regenerate.)';
  if(card.sources.length){
    draft += '\n\n---\n**Sources**\n';
    card.sources.forEach(s=>{ draft += '- [' + (s.label||s.url) + '](' + s.url + ')\n'; });
  }
  return draft;
}

// ---- live Substack publish (via a GitHub Actions workflow relay) ----
// The browser can't do this directly: fetch()/XHR are barred from ever
// setting a Cookie header, and Substack's endpoints aren't CORS-open to
// third-party origins anyway. So the actual Substack API call happens
// server-side in a GitHub Actions workflow (publish-substack.yml) that reads
// the SUBSTACK_SESSION_COOKIE repo secret; this app only ever talks to
// GitHub's own API, which is what it already does for everything else.
const PUBLISH_WORKFLOW_FILE = 'publish-substack.yml';
const PUBLICATION_URL = 'https://econchrisclarke.substack.com/';

function openSubstackConfirm(card){
  const modal = document.getElementById('substackConfirmModal-el');
  const coverHtml = card.coverImage
    ? '<img src="'+escapeHtml(imgSrc(card.coverImage.path))+'" style="max-width:100%;border-radius:6px;border:1px solid var(--line);margin-bottom:10px;display:block;">'
    : '';
  const previewText = (card.script||'').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/[#*_]|<\/?u>/g,'').replace(/\s+/g,' ').trim().slice(0, 300);
  modal.innerHTML =
    '<h2>Publish to Substack?</h2>' +
    '<div class="banner bad">This publishes live to <strong>'+PUBLICATION_URL+'</strong> and emails every subscriber immediately. There\'s no undo from here — you\'d need to unpublish/delete it manually in Substack afterward.</div>' +
    coverHtml +
    '<div style="font-family:var(--font-display);font-weight:700;font-size:1.2em;margin-bottom:2px;">'+escapeHtml(card.title)+'</div>' +
    (card.subtitle ? '<div style="color:var(--ink-soft);margin-bottom:10px;">'+escapeHtml(card.subtitle)+'</div>' : '') +
    '<div class="note" style="margin-bottom:14px;">'+escapeHtml(previewText)+(card.script && card.script.length>300 ? '…' : '')+'</div>' +
    (card.tags.length ? '<div class="note">Tags: '+card.tags.map(escapeHtml).join(', ')+'</div>' : '') +
    '<div class="note">Audience: everyone (free)</div>' +
    '<div class="modal-actions"><div class="left"><button class="ghost" id="substackConfirmCancel">Cancel</button></div>' +
      '<button class="primary" id="substackConfirmGo" style="background:var(--danger);">Yes, publish now</button></div>';
  document.getElementById('substackConfirmOverlay-el').classList.add('open');
  document.getElementById('substackConfirmCancel').onclick = closeSubstackConfirm;
  document.getElementById('substackConfirmGo').onclick = ()=> triggerSubstackPublish(card);
}
function closeSubstackConfirm(){
  document.getElementById('substackConfirmOverlay-el').classList.remove('open');
}

async function triggerSubstackPublish(card){
  closeSubstackConfirm();
  if(!syncEnabled || !ghConfig){
    setSyncStatus('bad', 'Connect to GitHub in Settings before publishing.');
    return;
  }
  card.platforms.substack.status = 'publishing';
  if(openCardId===card.id) renderModal();
  setSyncStatus('', 'Triggering Substack publish…');
  try{
    const url = 'https://api.github.com/repos/'+ghConfig.owner+'/'+ghConfig.repo+'/actions/workflows/'+PUBLISH_WORKFLOW_FILE+'/dispatches';
    const res = await fetch(url, {
      method: 'POST',
      headers: Object.assign({'Content-Type':'application/json'}, ghHeaders()),
      body: JSON.stringify({ref: ghConfig.branch, inputs: {card_id: card.id}})
    });
    if(!res.ok){
      const text = await res.text();
      throw {code:'http_'+res.status, message:text};
    }
    setSyncStatus('', 'Publishing to Substack — this can take up to a minute…');
    pollSubstackPublishStatus(card.id, 0);
  }catch(err){
    card.platforms.substack.status = 'not_started';
    if(openCardId===card.id) renderModal();
    setSyncStatus('bad', "Couldn't trigger the Substack publish workflow — check the GitHub token has Actions permission in Settings.");
  }
}

// The workflow_dispatch API is fire-and-forget (no run id returned), so we
// poll the saved cards.json itself — the workflow writes the result (status
// + published link, or a failure marker) straight back to the card when it
// finishes. Local edits made to other fields while this is running are
// preserved; only the substack platform status/link are pulled from remote.
async function pollSubstackPublishStatus(cardId, attempt){
  const MAX_ATTEMPTS = 20; // ~20 * 4s = 80s
  if(attempt >= MAX_ATTEMPTS){
    setSyncStatus('bad', 'Still working — check the Actions tab on GitHub for progress: github.com/'+ghConfig.owner+'/'+ghConfig.repo+'/actions');
    return;
  }
  try{
    const file = await ghGetFile(DATA_PATH);
    if(file){
      const json = JSON.parse(b64DecodeUnicode(file.content));
      const cards = Array.isArray(json.cards) ? json.cards : [];
      const remote = cards.find(c=>c.id===cardId);
      const remoteSt = remote && remote.platforms && remote.platforms.substack;
      if(remoteSt && remoteSt.status === 'published'){
        const local = state.cards.find(c=>c.id===cardId);
        if(local){
          local.platforms.substack.status = 'published';
          local.platforms.substack.link = remoteSt.link;
          if(openCardId===cardId) renderModal();
        }
        cardsSha = file.sha;
        setSyncStatus('ok', 'Published to Substack: ' + remoteSt.link);
        render();
        return;
      }
      if(remoteSt && remoteSt.status === 'publish_failed'){
        const local = state.cards.find(c=>c.id===cardId);
        if(local){ local.platforms.substack.status = 'not_started'; if(openCardId===cardId) renderModal(); }
        setSyncStatus('bad', 'Substack publish failed — check the Actions tab on GitHub for details: github.com/'+ghConfig.owner+'/'+ghConfig.repo+'/actions');
        return;
      }
    }
  }catch(err){ /* transient read failure — keep polling */ }
  setTimeout(()=>pollSubstackPublishStatus(cardId, attempt+1), 4000);
}

function trimToLimit(text, limit){
  if(!limit || text.length<=limit) return text;
  const cut = text.slice(0, limit-1);
  const lastSpace = cut.lastIndexOf(' ');
  return (lastSpace>0 ? cut.slice(0,lastSpace) : cut) + '…';
}
function stripHashtags(text){
  return text.replace(/\s?#\w+/g, '').replace(/\s{2,}/g,' ').trim();
}
function generateCaptionVariants(card){
  const base = card.baseCaption || '';
  PLATFORMS.forEach(p=>{
    if(p.isSubstack) return;
    let text = base;
    if(!p.hashtags) text = stripHashtags(text);
    text = trimToLimit(text, p.limit);
    card.platforms[p.key].caption = text;
  });
}
function addDays(d, n){
  const r = new Date(d); r.setDate(r.getDate()+n);
  return r.toISOString().slice(0,10);
}

// ---- image upload ----

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function safeExt(filename){
  const m = /\.([a-zA-Z0-9]+)$/.exec(filename || '');
  return (m ? m[1] : 'png').toLowerCase().replace(/[^a-z0-9]/g,'') || 'png';
}

// Images live inline in the script text as their own paragraph, tagged
// with plain markdown: ![caption](data/images/xyz.png). That keeps ordering
// and wording exactly as the writer intended, and means the script is
// already Substack-ready — the draft generator just uses it verbatim.
// Captions can themselves contain an inline [label](url) hyperlink (the same
// Ctrl/Cmd+K feature the script text has), which means a caption can contain
// its own "]" and "(" characters — so parseImageLine finds the outer
// path boundary from the LAST "](" in the line rather than the first "]",
// since the repo-relative path itself never contains that substring.
function parseImageLine(line){
  const t = line.trim();
  if(!t.startsWith('![') || !t.endsWith(')')) return null;
  const cut = t.lastIndexOf('](');
  if(cut === -1) return null;
  const path = t.slice(cut + 2, -1);
  if(!path) return null;
  return { caption: t.slice(2, cut), path };
}
function scriptImageTag(path, caption){
  return '![' + (caption || '').trim() + '](' + path + ')';
}
function isImageLine(line){ return !!parseImageLine(line); }
function imageLinePath(line){ const p = parseImageLine(line); return p ? p.path : null; }
function imageLineCaption(line){ const p = parseImageLine(line); return p ? p.caption : ''; }
function removeImageFromScript(script, path){
  const esc = path.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re = new RegExp('\\n*!\\[[\\s\\S]*?\\]\\('+esc+'\\)\\n*','g');
  return script.replace(re, '\n\n').replace(/\n{3,}/g,'\n\n').trim();
}
function orphanedImages(card){
  const text = card.script || '';
  return (card.images||[]).filter(img=>img.path && !text.includes(']('+img.path+')'));
}

// The script editor is a contenteditable div, not a textarea+preview pair —
// images render as real <img> elements right inside the box you're typing
// in. Every node it contains is built with createElement/createTextNode,
// never innerHTML-from-a-string, so pasted or typed text (including things
// like literal HTML tags) can never be interpreted as markup.

let savedEditorRange = null; // last known caret position while the editor had focus, so "Insert image" still knows where to drop the image after the file picker steals focus
document.addEventListener('selectionchange', ()=>{
  const editorEl = document.getElementById('scriptEditor');
  if(!editorEl){ savedEditorRange = null; return; }
  const sel = document.getSelection();
  if(sel && sel.rangeCount && editorEl.contains(sel.anchorNode)){
    savedEditorRange = sel.getRangeAt(0).cloneRange();
  }
});

// ---- word-processor-style hyperlinks in the script text (and captions) ----
// Two "editable roots" carry this feature: the main #scriptEditor, and each
// image's .imgcaption (a contenteditable div, not a plain <input>, precisely
// so it can hold a real inline <a> the same way script paragraphs can).
// Three ways in: Ctrl/Cmd+K with text selected jumps straight to the link
// popover; right-clicking selected text, or the floating selection toolbar
// that appears automatically a moment after any text selection settles,
// offer a small menu (Copy/Cut/Paste/Search/Link) — the mobile equivalent of
// a long-press menu, since mobile browsers generally don't hand a custom
// "contextmenu" event to JS for a plain-text long-press the way desktop
// right-click does, so a toolbar that shows up once a selection has settled
// is the reliable cross-browser substitute for what long-pressing to select
// naturally leads into.
const LINK_SCHEME_RE = /^[a-zA-Z][a-zA-Z0-9+.-]*:/;
function normalizeLinkUrl(raw){
  const v = (raw || '').trim();
  if(!v) return '';
  if(v.startsWith('#') || LINK_SCHEME_RE.test(v)) return v;
  return 'https://' + v;
}
function findLinkAncestor(node){
  while(node && node.nodeType !== 9){
    if(node.nodeType === 1 && node.tagName === 'A' && node.classList.contains('scriptlink')) return node;
    node = node.parentNode;
  }
  return null;
}
// Which editable region (if any) a node lives in for link/toolbar purposes:
// the caption itself if it's inside one (even though the caption sits inside
// a contentEditable="false" image island), #scriptEditor if it's plain
// script text, or null for anything else in an image wrap (the "×" remove
// button, the raw <img> — those keep the image's own long-press/crop menu).
function findLinkEditableRoot(node){
  let n = node;
  while(n && n.nodeType !== 9){
    if(n.nodeType === 1 && n.classList && n.classList.contains('imgcaption')) return n;
    if(n.nodeType === 1 && n.classList && n.classList.contains('inline-imgwrap')) return null;
    if(n.nodeType === 1 && n.id === 'scriptEditor') return n;
    n = n.parentNode;
  }
  return null;
}

let closeLinkPopoverHandler = null;
function closeLinkPopover(){
  const existing = document.querySelector('.link-popover');
  if(existing) existing.remove();
  if(closeLinkPopoverHandler){ document.removeEventListener('pointerdown', closeLinkPopoverHandler, true); closeLinkPopoverHandler = null; }
}
function positionFloatingEl(el, rect, above){
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = Math.max(8, Math.min(rect.left, window.innerWidth - w - 8));
  let top = above ? rect.top - h - 8 : rect.bottom + 6;
  if(above && top < 4) top = rect.bottom + 8;
  if(!above && top + h > window.innerHeight - 8) top = rect.top - h - 6;
  el.style.left = left + 'px';
  el.style.top = top + 'px';
}
function openLinkPopover(rect, opts){
  closeLinkPopover();
  closeSelectionToolbar();
  const pop = document.createElement('div');
  pop.className = 'link-popover';
  pop.contentEditable = 'false';
  const input = document.createElement('input');
  input.type = 'url';
  input.placeholder = 'https://…';
  input.value = opts.mode === 'edit' ? (opts.anchorEl.getAttribute('href') || '') : '';
  const applyBtn = document.createElement('button');
  applyBtn.type = 'button';
  applyBtn.className = 'primary';
  applyBtn.textContent = opts.mode === 'edit' ? 'Update' : 'Add link';
  pop.appendChild(input);
  pop.appendChild(applyBtn);
  if(opts.mode === 'edit'){
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'ghost';
    removeBtn.textContent = 'Remove';
    removeBtn.onclick = (e)=>{
      e.preventDefault();
      opts.anchorEl.replaceWith(document.createTextNode(opts.anchorEl.textContent));
      closeLinkPopover();
    };
    pop.appendChild(removeBtn);
  }
  document.body.appendChild(pop);
  positionFloatingEl(pop, rect, false);
  const apply = ()=>{
    const url = normalizeLinkUrl(input.value);
    if(!url) return;
    if(opts.mode === 'edit'){
      opts.anchorEl.setAttribute('href', url);
    } else {
      const root = opts.editableRoot;
      root.focus();
      const sel = document.getSelection();
      sel.removeAllRanges();
      sel.addRange(opts.range);
      document.execCommand('createLink', false, url);
      root.querySelectorAll('a:not(.scriptlink)').forEach(a=>{
        a.classList.add('scriptlink');
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      });
    }
    closeLinkPopover();
  };
  applyBtn.onclick = (e)=>{ e.preventDefault(); apply(); };
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); apply(); }
    else if(e.key === 'Escape'){ e.preventDefault(); closeLinkPopover(); }
  });
  input.focus();
  input.select();
  closeLinkPopoverHandler = (e)=>{ if(!pop.contains(e.target)) closeLinkPopover(); };
  setTimeout(()=>document.addEventListener('pointerdown', closeLinkPopoverHandler, true), 0);
}

function triggerLinkUI(range, editableRoot){
  if(!range) return;
  const startAnchor = findLinkAncestor(range.startContainer);
  const endAnchor = findLinkAncestor(range.endContainer);
  if(startAnchor && startAnchor === endAnchor){
    openLinkPopover(startAnchor.getBoundingClientRect(), {mode:'edit', anchorEl: startAnchor});
    return;
  }
  if(range.collapsed || !editableRoot) return; // nothing highlighted, and not sitting inside an existing link
  openLinkPopover(range.getBoundingClientRect(), {mode:'create', range: range.cloneRange(), editableRoot});
}

// The floating selection toolbar offers the same everyday actions a native
// long-press/right-click menu would (copy/cut/paste/search) alongside Link,
// since our own popover replaces the native menu when it takes over the
// gesture — leaving those out would be a step backward from what the
// browser already gave people for free.
let selectionToolbarEl = null;
let selectionToolbarCloseHandler = null;
let selectionToolbarShownForRange = null;
function closeSelectionToolbar(){
  if(selectionToolbarEl){ selectionToolbarEl.remove(); selectionToolbarEl = null; }
  if(selectionToolbarCloseHandler){ document.removeEventListener('pointerdown', selectionToolbarCloseHandler, true); selectionToolbarCloseHandler = null; }
  selectionToolbarShownForRange = null;
}
function rangesEqual(a, b){
  return !!a && !!b && a.startContainer===b.startContainer && a.startOffset===b.startOffset && a.endContainer===b.endContainer && a.endOffset===b.endOffset;
}
function showSelectionToolbar(rect, range, editableRoot){
  closeSelectionToolbar();
  closeLinkPopover();
  const savedRange = range.cloneRange();
  const selectedText = savedRange.toString();
  const restoreSelection = ()=>{
    editableRoot.focus();
    const sel = document.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  };
  const bar = document.createElement('div');
  bar.className = 'selection-toolbar';
  bar.contentEditable = 'false';
  const mk = (label, title, fn)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'selection-toolbar-btn';
    b.title = title;
    b.textContent = label;
    b.addEventListener('pointerdown', (e)=>e.preventDefault()); // don't let the tap collapse the selection first
    b.addEventListener('click', (e)=>{ e.preventDefault(); fn(); });
    return b;
  };
  bar.appendChild(mk('⧉', 'Copy', ()=>{ restoreSelection(); document.execCommand('copy'); closeSelectionToolbar(); }));
  bar.appendChild(mk('✂', 'Cut', ()=>{ restoreSelection(); document.execCommand('cut'); closeSelectionToolbar(); }));
  bar.appendChild(mk('📋', 'Paste', async ()=>{
    restoreSelection();
    try{
      const text = await navigator.clipboard.readText();
      document.execCommand('insertText', false, text);
    }catch(err){
      document.execCommand('paste'); // most browsers block this; readText above is the real path
    }
    closeSelectionToolbar();
  }));
  const applyFormat = (cmd)=>{ restoreSelection(); document.execCommand(cmd); closeSelectionToolbar(); };
  const boldBtn = mk('B', 'Bold', ()=>applyFormat('bold'));
  boldBtn.style.fontWeight = '800';
  const italicBtn = mk('I', 'Italic', ()=>applyFormat('italic'));
  italicBtn.style.fontStyle = 'italic';
  const underlineBtn = mk('U', 'Underline', ()=>applyFormat('underline'));
  underlineBtn.style.textDecoration = 'underline';
  // Reflect whether the current selection is already bold/italic/underlined —
  // a quick glance tells you what you'd be toggling before you tap it.
  try{ if(document.queryCommandState('bold')) boldBtn.classList.add('active'); }catch(e){}
  try{ if(document.queryCommandState('italic')) italicBtn.classList.add('active'); }catch(e){}
  try{ if(document.queryCommandState('underline')) underlineBtn.classList.add('active'); }catch(e){}
  bar.appendChild(boldBtn);
  bar.appendChild(italicBtn);
  bar.appendChild(underlineBtn);
  bar.appendChild(mk('🔍', 'Search the web', ()=>{
    window.open('https://www.google.com/search?q=' + encodeURIComponent(selectedText), '_blank', 'noopener');
    closeSelectionToolbar();
  }));
  bar.appendChild(mk('🔗', 'Link', ()=>{
    closeSelectionToolbar();
    triggerLinkUI(savedRange, editableRoot);
  }));
  document.body.appendChild(bar);
  positionFloatingEl(bar, rect, true);
  selectionToolbarEl = bar;
  selectionToolbarShownForRange = savedRange;
  selectionToolbarCloseHandler = (e)=>{ if(!bar.contains(e.target)) closeSelectionToolbar(); };
  setTimeout(()=>document.addEventListener('pointerdown', selectionToolbarCloseHandler, true), 0);
}

document.addEventListener('keydown', (e)=>{
  if((e.key !== 'k' && e.key !== 'K') || !(e.ctrlKey || e.metaKey)) return;
  const sel = document.getSelection();
  if(!sel || !sel.rangeCount) return;
  const root = findLinkEditableRoot(sel.anchorNode);
  if(!root) return;
  e.preventDefault();
  triggerLinkUI(sel.getRangeAt(0).cloneRange(), root);
});

document.addEventListener('contextmenu', (e)=>{
  const root = findLinkEditableRoot(e.target);
  if(!root) return;
  const sel = document.getSelection();
  if(!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const inLink = findLinkAncestor(range.startContainer);
  if(range.collapsed && !inLink) return; // nothing to act on — let the normal menu show
  e.preventDefault();
  if(inLink){ triggerLinkUI(range.cloneRange(), root); return; }
  showSelectionToolbar(range.getBoundingClientRect(), range, root);
});

// The toolbar deliberately waits for the selection to stop changing before
// it appears — on mobile, dragging the native selection handles fires
// selectionchange continuously while the highlighted range is still
// growing/shrinking, and popping the toolbar up on every intermediate word
// would make it jump around under the user's thumb. Debouncing means it
// only shows once the highlighted area has actually settled.
//
// Two extra guards keep this from fighting with the other two entry points:
// a link popover already open owns the selection (Ctrl/Cmd+K and the
// "edit existing link" path both jump straight there, bypassing the
// toolbar) so a lingering selectionchange from the gesture that led there
// shouldn't schedule a toolbar underneath it; and a selectionchange that
// reports the exact same range a right-click just opened the toolbar for
// (a queued event racing a few milliseconds behind the synchronous
// contextmenu handler) shouldn't flash it closed and reopen it a moment
// later — only an actually different selection should restart the debounce.
let selectionToolbarDebounce = null;
document.addEventListener('selectionchange', ()=>{
  if(document.querySelector('.link-popover')) return;
  const sel = document.getSelection();
  const range = (sel && sel.rangeCount && !sel.isCollapsed) ? sel.getRangeAt(0) : null;
  const root = range ? findLinkEditableRoot(range.commonAncestorContainer) : null;
  if(!root){
    if(selectionToolbarDebounce){ clearTimeout(selectionToolbarDebounce); selectionToolbarDebounce = null; }
    closeSelectionToolbar();
    return;
  }
  if(selectionToolbarEl && rangesEqual(range, selectionToolbarShownForRange)) return;
  if(selectionToolbarDebounce) clearTimeout(selectionToolbarDebounce);
  closeSelectionToolbar(); // don't leave a stale one showing at the old position while the selection is still moving
  selectionToolbarDebounce = setTimeout(()=>{
    selectionToolbarDebounce = null;
    if(document.querySelector('.link-popover')) return;
    const sel2 = document.getSelection();
    if(!sel2 || !sel2.rangeCount || sel2.isCollapsed) return;
    const range2 = sel2.getRangeAt(0);
    const root2 = findLinkEditableRoot(range2.commonAncestorContainer);
    if(!root2) return;
    const rect = range2.getBoundingClientRect();
    if(!rect || (rect.width === 0 && rect.height === 0)) return;
    showSelectionToolbar(rect, range2, root2);
  }, 300);
});

function buildImageNode(card, path, caption){
  const wrap = document.createElement('div');
  wrap.className = 'inline-imgwrap';
  wrap.contentEditable = 'false'; // an atomic, non-editable island inside the editable editor
  wrap.dataset.path = path;
  const img = document.createElement('img');
  img.className = 'inline-image';
  img.loading = 'lazy';
  img.src = imgSrc(path);
  // A Substack-style caption right under the image — plain italic text,
  // centered, no border until focused. It's a small contenteditable div (not
  // a plain <input>), so — despite living inside this contentEditable="false"
  // image island — it can hold real mixed text + <a class="scriptlink">
  // content: the same Ctrl/Cmd+K / right-click / selection-toolbar hyperlink
  // feature the main script text has works here too. Stored as the image's
  // markdown alt text so it survives in card.script and rides along verbatim
  // into the Substack draft; a caption's own inline link is stored the same
  // way script-text links are, as [label](url) inside that alt text.
  const cap = document.createElement('div');
  cap.contentEditable = 'true';
  cap.className = 'imgcaption';
  cap.dataset.placeholder = 'Add a caption…';
  if(caption) appendInlineMarkdown(cap, caption);
  cap.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); cap.blur(); } // single-line: Enter confirms instead of adding a line break
  });
  cap.addEventListener('paste', (e)=>{
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/[\r\n]+/g, ' ');
    document.execCommand('insertText', false, text);
  });
  cap.addEventListener('input', ()=>{
    // Chrome/Safari leave a stray <br> behind after deleting all text in a
    // contenteditable, which would otherwise keep the :empty placeholder from
    // reappearing.
    if(!cap.textContent.trim() && cap.innerHTML) cap.innerHTML = '';
  });
  const rm = document.createElement('button');
  rm.type = 'button';
  rm.className = 'rm';
  rm.title = 'Remove';
  rm.textContent = '×';
  rm.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); removeInlineImageNode(card, wrap, path); };
  wrap.appendChild(img);
  wrap.appendChild(cap);
  wrap.appendChild(rm);
  attachLongPress(wrap, card, path);
  return wrap;
}

// Long-press on an inline image (touch-hold, ~500ms with no significant
// finger movement) opens a small menu: reorder up/down, or crop. On desktop,
// the same menu opens with a right-click instead — the pointer-based long
// press is scoped to touch/pen input so a mouse never has to sit and hold.
// A quick tap still just goes through to the "×" remove button as before.
function attachLongPress(wrap, card, path){
  let timer = null, startX = 0, startY = 0;
  const cancel = ()=>{ if(timer){ clearTimeout(timer); timer = null; } };
  wrap.addEventListener('pointerdown', (e)=>{
    if(e.pointerType !== 'touch' && e.pointerType !== 'pen') return; // desktop uses right-click instead
    if(e.target.closest && e.target.closest('.rm, .imgcaption')) return;
    startX = e.clientX; startY = e.clientY;
    cancel();
    // Read wrap.dataset.path live rather than closing over the initial `path`:
    // after a crop, applyCroppedImage swaps the wrapper onto a new path in
    // place (same DOM node), so a stale closure here would keep pointing
    // crop/menu actions at the original, now-deleted image path forever.
    timer = setTimeout(()=>{ timer = null; showImageMenu(wrap, card, wrap.dataset.path); }, 500);
  });
  wrap.addEventListener('pointermove', (e)=>{
    if(timer && (Math.abs(e.clientX-startX)>10 || Math.abs(e.clientY-startY)>10)) cancel();
  });
  wrap.addEventListener('pointerup', cancel);
  wrap.addEventListener('pointercancel', cancel);
  wrap.addEventListener('contextmenu', (e)=>{
    if(e.target.closest && e.target.closest('.rm, .imgcaption')) return;
    e.preventDefault();
    e.stopPropagation(); // don't also trigger the editor-wide link-on-selection contextmenu handler below
    showImageMenu(wrap, card, wrap.dataset.path);
  });
}

let closeImageMenuHandler = null;
function closeImageMenu(){
  const existing = document.querySelector('.img-longpress-menu');
  if(existing) existing.remove();
  if(closeImageMenuHandler){ document.removeEventListener('pointerdown', closeImageMenuHandler, true); closeImageMenuHandler = null; }
}
// Copies an inline image to the system clipboard as a real image (not a
// link or a file), so images kept in a card can be pasted straight into any
// other app — Notes, Slack, an email, a slide. Always re-encodes to PNG via
// a canvas rather than copying the original bytes verbatim: the Clipboard
// API's image support is only broadly guaranteed for image/png across
// browsers, so a JPEG/GIF/WebP source needs converting to paste reliably
// everywhere. Images on this page are always same-origin (served relative
// to the Pages site) or session-local blob: URLs, so drawing them to canvas
// never taints it.
async function copyImageToClipboard(path){
  if(!navigator.clipboard || !window.ClipboardItem){
    setSyncStatus('bad', "This browser doesn't support copying images to the clipboard.");
    return;
  }
  try{
    const img = new Image();
    await new Promise((resolve, reject)=>{
      img.onload = resolve;
      img.onerror = ()=>reject(new Error('image load failed'));
      img.src = imgSrc(path);
    });
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext('2d').drawImage(img, 0, 0);
    const blob = await new Promise(resolve=>canvas.toBlob(resolve, 'image/png'));
    if(!blob) throw new Error('canvas export failed');
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
    setSyncStatus('ok', 'Image copied — paste it anywhere.');
  }catch(err){
    setSyncStatus('bad', "Couldn't copy the image — try again, or use your browser's own \"Copy image\" option on it.");
  }
}

function showImageMenu(wrap, card, path){
  closeImageMenu();
  const menu = document.createElement('div');
  menu.className = 'img-longpress-menu';
  menu.contentEditable = 'false';
  const mkBtn = (label, title, fn)=>{
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'small-btn'; b.title = title; b.textContent = label;
    b.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); closeImageMenu(); fn(); };
    return b;
  };
  menu.appendChild(mkBtn('⧉ Copy', 'Copy image to clipboard', ()=>copyImageToClipboard(path)));
  menu.appendChild(mkBtn('↑', 'Move up', ()=>moveImageBlock(card, wrap, -1)));
  menu.appendChild(mkBtn('↓', 'Move down', ()=>moveImageBlock(card, wrap, 1)));
  menu.appendChild(mkBtn('✂ Crop', 'Crop image', ()=>openCropper(card, path, wrap)));
  wrap.appendChild(menu);
  closeImageMenuHandler = (e)=>{ if(!menu.contains(e.target)) closeImageMenu(); };
  setTimeout(()=>document.addEventListener('pointerdown', closeImageMenuHandler, true), 0);
}

function moveImageBlock(card, wrap, direction){
  const editorEl = document.getElementById('scriptEditor');
  if(!editorEl || !wrap.parentNode) return;
  // Swap with the immediately adjacent sibling — one paragraph (or image) at
  // a time — whatever that sibling is. Earlier this skipped over paragraph
  // text to jump straight to the next image, which meant "move down" could
  // leap the image past several paragraphs in one click; moving one block at
  // a time keeps reordering predictable relative to the surrounding text.
  if(direction<0){
    const sib = wrap.previousSibling;
    if(sib) editorEl.insertBefore(wrap, sib);
  } else {
    const sib = wrap.nextSibling;
    if(sib) editorEl.insertBefore(sib, wrap);
  }
  ensureImageSpacers(editorEl);
  card.script = serializeScriptEditor(editorEl);
  saveToGitHub();
}

// ---- crop ----

function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function closeCropper(){
  document.getElementById('cropOverlay-el').classList.remove('open');
  document.getElementById('cropModal-el').innerHTML = '';
}

function openCropper(card, path, wrapEl){
  const probe = new Image();
  probe.onload = ()=>{
    const modal = document.getElementById('cropModal-el');
    modal.innerHTML = '';
    const h2 = document.createElement('h2'); h2.textContent = 'Crop image';
    const stage = document.createElement('div'); stage.className = 'cropstage'; stage.id = 'cropStage';
    const cropImgEl = document.createElement('img'); cropImgEl.id = 'cropImg'; cropImgEl.src = imgSrc(path);
    const rect = document.createElement('div'); rect.className = 'croprect'; rect.id = 'cropRect';
    ['nw','ne','sw','se'].forEach(pos=>{
      const h = document.createElement('div'); h.className = 'crophandle '+pos; h.dataset.h = pos;
      rect.appendChild(h);
    });
    stage.appendChild(cropImgEl); stage.appendChild(rect);
    const actions = document.createElement('div'); actions.className = 'modal-actions';
    const left = document.createElement('div'); left.className = 'left';
    const cancelBtn = document.createElement('button'); cancelBtn.className='ghost'; cancelBtn.textContent='Cancel'; cancelBtn.type='button';
    const applyBtn = document.createElement('button'); applyBtn.className='primary'; applyBtn.textContent='Apply crop'; applyBtn.type='button';
    left.appendChild(cancelBtn); actions.appendChild(left); actions.appendChild(applyBtn);
    modal.appendChild(h2); modal.appendChild(stage); modal.appendChild(actions);
    document.getElementById('cropOverlay-el').classList.add('open');
    cancelBtn.onclick = closeCropper;

    requestAnimationFrame(()=>{
      const sw = stage.clientWidth, sh = cropImgEl.clientHeight;
      if(!sw || !sh){ closeCropper(); setSyncStatus('bad', "Couldn't open the cropper — try again."); return; }
      let box = { x: sw*0.1, y: sh*0.1, w: sw*0.8, h: sh*0.8 };
      const applyRectStyle = ()=>{
        rect.style.left = box.x+'px'; rect.style.top = box.y+'px';
        rect.style.width = box.w+'px'; rect.style.height = box.h+'px';
      };
      applyRectStyle();

      let mode = null, startPt = null, startBox = null;
      const MIN = 24;
      const onDown = (e, m)=>{
        mode = m; startPt = {x:e.clientX, y:e.clientY}; startBox = Object.assign({}, box);
        if(e.target.setPointerCapture){ try{ e.target.setPointerCapture(e.pointerId); }catch(err){} }
        e.preventDefault();
      };
      const onMove = (e)=>{
        if(!mode) return;
        const dx = e.clientX-startPt.x, dy = e.clientY-startPt.y;
        if(mode==='move'){
          // Pure translation: size never changes, so clamp position against
          // the box's own (unchanging) width/height.
          box.x = Math.max(0, Math.min(startBox.x+dx, sw - box.w));
          box.y = Math.max(0, Math.min(startBox.y+dy, sh - box.h));
        } else {
          // Resize: the opposite edge/corner is the anchor and must stay put.
          // Clamp the *moving* edge against the stage and the anchor, then
          // derive x/w (or y/h) from that — clamping x and w independently
          // (as before) let a far-negative x inflate w past the stage edge.
          if(mode.indexOf('w')!==-1){
            const anchorRight = startBox.x + startBox.w;
            const left = Math.max(0, Math.min(startBox.x+dx, anchorRight-MIN));
            box.x = left; box.w = anchorRight - left;
          }
          if(mode.indexOf('e')!==-1){
            const anchorLeft = startBox.x;
            const right = Math.min(sw, Math.max(startBox.x+startBox.w+dx, anchorLeft+MIN));
            box.w = right - anchorLeft;
          }
          if(mode.indexOf('n')!==-1){
            const anchorBottom = startBox.y + startBox.h;
            const top = Math.max(0, Math.min(startBox.y+dy, anchorBottom-MIN));
            box.y = top; box.h = anchorBottom - top;
          }
          if(mode.indexOf('s')!==-1){
            const anchorTop = startBox.y;
            const bottom = Math.min(sh, Math.max(startBox.y+startBox.h+dy, anchorTop+MIN));
            box.h = bottom - anchorTop;
          }
        }
        applyRectStyle();
      };
      const onUp = ()=>{ mode = null; };

      rect.addEventListener('pointerdown', (e)=>{ if(e.target.classList.contains('crophandle')) return; onDown(e, 'move'); });
      rect.querySelectorAll('.crophandle').forEach(h=>{
        h.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); onDown(e, h.dataset.h); });
      });
      stage.addEventListener('pointermove', onMove);
      stage.addEventListener('pointerup', onUp);
      stage.addEventListener('pointercancel', onUp);

      applyBtn.onclick = ()=>{
        const scaleX = cropImgEl.naturalWidth / sw;
        const scaleY = cropImgEl.naturalHeight / sh;
        const sx = box.x*scaleX, sy = box.y*scaleY, sWid = box.w*scaleX, sHei = box.h*scaleY;
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(sWid));
        canvas.height = Math.max(1, Math.round(sHei));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(cropImgEl, sx, sy, sWid, sHei, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(async (blob)=>{
          if(!blob){ setSyncStatus('bad', 'Crop failed — could not process the image.'); return; }
          closeCropper();
          await applyCroppedImage(card, path, wrapEl, blob);
        }, 'image/png');
      };
    });
  };
  probe.onerror = ()=>{ setSyncStatus('bad', "Couldn't load this image to crop — try again once it's finished syncing."); };
  probe.src = imgSrc(path);
}

async function applyCroppedImage(card, oldPath, wrapEl, blob){
  if(!syncEnabled || !ghConfig){ setSyncStatus('bad', 'Connect to GitHub in Settings before cropping images.'); return; }
  setSyncStatus('', 'Saving cropped image…');
  try{
    const base64 = await blobToBase64(blob);
    const newPath = 'data/images/' + card.id + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6) + '.png';
    localImageBlobs.set(newPath, URL.createObjectURL(blob));
    await ghPutBinaryFile(newPath, base64, 'Crop image for card ' + card.id);
    card.images = (card.images||[]).filter(i=>i.path!==oldPath);
    card.images.push({path:newPath});
    if(wrapEl && wrapEl.isConnected){
      wrapEl.dataset.path = newPath;
      const imgEl = wrapEl.querySelector('img');
      if(imgEl) imgEl.src = imgSrc(newPath);
    }
    if(localImageBlobs.has(oldPath)){ URL.revokeObjectURL(localImageBlobs.get(oldPath)); localImageBlobs.delete(oldPath); }
    const editorEl = document.getElementById('scriptEditor');
    if(editorEl) card.script = serializeScriptEditor(editorEl);
    saveToGitHub();
    ghGetFile(oldPath).then(f=>{ if(f) ghDeleteFile(oldPath, f.sha, 'Remove pre-crop original for card ' + card.id); }).catch(()=>{});
  }catch(err){
    setSyncStatus('bad', 'Crop upload failed — check your GitHub connection in Settings.');
  }
}

// Two inline images with nothing between them leave no ordinary text node in
// that gap for a tap to land a caret on — mobile browsers were snapping the
// cursor somewhere unexpected instead of where the user meant. Whenever two
// images end up directly adjacent (initial render, after inserting new
// images, after removing one that was separating two others, after a
// reorder), automatically slot in a plain empty paragraph between them so
// there's always a normal tap target there. It's an ordinary editable
// paragraph like any other — if the user never types into it, it simply
// isn't saved (serializeScriptEditor drops empty paragraphs), so it doesn't
// pollute the script text; it just quietly reappears next time this runs.
function ensureImageSpacers(editorEl){
  const isImg = n => !!(n && n.nodeType===1 && n.classList && n.classList.contains('inline-imgwrap'));
  const isBlankP = n => !!(n && n.nodeType===1 && n.tagName==='P' && !n.textContent.trim());
  // Collapse runs of consecutive blank paragraphs first — e.g. removing an
  // image that used to sit between two spacer paragraphs would otherwise
  // leave both spacers behind as a stray double gap.
  let node = editorEl.firstChild;
  while(node){
    const next = node.nextSibling;
    if(isBlankP(node) && isBlankP(next)){
      editorEl.removeChild(next);
      continue; // re-check node against its new next sibling
    }
    node = next;
  }
  // Then make sure every remaining pair of directly-adjacent images has a
  // blank paragraph between them.
  node = editorEl.firstChild;
  while(node && node.nextSibling){
    const next = node.nextSibling;
    if(isImg(node) && isImg(next)){
      const spacer = document.createElement('p');
      spacer.appendChild(document.createElement('br'));
      editorEl.insertBefore(spacer, next);
    }
    node = node.nextSibling;
  }
}

// A block starting with 1-3 '#' + a space is a heading (Substack/markdown
// convention — matches how the Substack draft generator already ships the
// script text verbatim). Only the block's first line is checked; any further
// lines in the same block (rare — Enter inside a heading normally starts a
// new block) still ride along inside the same heading element via <br>, the
// same way multi-line paragraphs already work.
const HEADER_LINE_RE = /^(#{1,3})\s+([^\n]*)/;

function populateScriptEditor(editorEl, script, card){
  editorEl.innerHTML = '';
  const blocks = (script || '').split(/\n{2,}/);
  blocks.forEach(block=>{
    const trimmed = block.trim();
    if(!trimmed) return;
    if(isImageLine(trimmed)){
      editorEl.appendChild(buildImageNode(card, imageLinePath(trimmed), imageLineCaption(trimmed)));
      return;
    }
    const headerMatch = HEADER_LINE_RE.exec(trimmed);
    if(headerMatch){
      const h = document.createElement('h' + headerMatch[1].length);
      const rest = trimmed.slice(headerMatch[0].length);
      appendInlineMarkdown(h, headerMatch[2]);
      if(rest.startsWith('\n')){
        rest.slice(1).split('\n').forEach(line=>{
          h.appendChild(document.createElement('br'));
          appendInlineMarkdown(h, line);
        });
      }
      editorEl.appendChild(h);
      return;
    }
    const p = document.createElement('p');
    trimmed.split('\n').forEach((line,idx)=>{
      if(idx>0) p.appendChild(document.createElement('br'));
      appendInlineMarkdown(p, line);
    });
    editorEl.appendChild(p);
  });
  ensureImageSpacers(editorEl);
  updateWordCountBar(editorEl);
}

// Inline formatting (bold, italic, underline, links) is stored as ordinary
// markdown/HTML mixed into the plain text — **bold**, *italic*, <u>underline</u>,
// [label](url) — the same way images and sources already ride along as
// markdown, so the script stays a single portable string (and drops straight
// into the Substack draft generator verbatim). appendInlineMarkdown turns
// that back into real <b>/<i>/<u>/<a class="scriptlink"> elements when the
// editor is (re)populated, recursing so marks can nest (e.g. a bold link);
// the reverse direction lives in serializeInlineContent below. Shared by
// script paragraphs, headings, and image captions alike.
function appendInlineMarkdown(parent, text){
  let i = 0;
  while(i < text.length){
    if(text.startsWith('**', i)){
      const end = text.indexOf('**', i+2);
      if(end !== -1){
        const b = document.createElement('b');
        appendInlineMarkdown(b, text.slice(i+2, end));
        parent.appendChild(b);
        i = end+2;
        continue;
      }
    }
    if(text[i] === '*'){
      const end = text.indexOf('*', i+1);
      if(end !== -1){
        const em = document.createElement('i');
        appendInlineMarkdown(em, text.slice(i+1, end));
        parent.appendChild(em);
        i = end+1;
        continue;
      }
    }
    if(text.startsWith('<u>', i)){
      const end = text.indexOf('</u>', i+3);
      if(end !== -1){
        const u = document.createElement('u');
        appendInlineMarkdown(u, text.slice(i+3, end));
        parent.appendChild(u);
        i = end+4;
        continue;
      }
    }
    if(text[i] === '['){
      const closeBracket = text.indexOf(']', i+1);
      if(closeBracket !== -1 && text[closeBracket+1] === '('){
        const closeParen = text.indexOf(')', closeBracket+2);
        if(closeParen !== -1){
          const a = document.createElement('a');
          a.className = 'scriptlink';
          a.href = text.slice(closeBracket+2, closeParen);
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          appendInlineMarkdown(a, text.slice(i+1, closeBracket));
          parent.appendChild(a);
          i = closeParen+1;
          continue;
        }
      }
    }
    // Plain run: consume up to the next character that could start a marker,
    // so ordinary text isn't scanned one character at a time.
    let j = i+1;
    while(j < text.length && text[j] !== '*' && text[j] !== '[' && !(text[j]==='<' && text.startsWith('<u>', j))) j++;
    parent.appendChild(document.createTextNode(text.slice(i, j)));
    i = j;
  }
}

// Recursive so nested marks (bold containing a link, etc.) round-trip
// correctly. Any element tag not recognized below (e.g. a stray <span>
// left by the browser) is unwrapped — its text survives, the wrapper doesn't.
function serializeInlineContent(el){
  let text = '';
  el.childNodes.forEach(n=>{
    if(n.nodeName === 'BR'){ text += '\n'; return; }
    if(n.nodeType !== 1){ text += n.textContent || ''; return; }
    const inner = serializeInlineContent(n);
    const tag = n.tagName;
    if(tag === 'A'){
      const href = n.getAttribute('href') || '';
      text += inner ? ('[' + inner + '](' + href + ')') : href;
    } else if(tag === 'B' || tag === 'STRONG'){
      text += inner ? ('**' + inner + '**') : '';
    } else if(tag === 'I' || tag === 'EM'){
      text += inner ? ('*' + inner + '*') : '';
    } else if(tag === 'U'){
      text += inner ? ('<u>' + inner + '</u>') : '';
    } else {
      text += inner;
    }
  });
  return text;
}

const HEADER_PREFIX = {H1:'# ', H2:'## ', H3:'### '};

function serializeScriptEditor(editorEl){
  const parts = [];
  editorEl.childNodes.forEach(node=>{
    if(node.nodeType===1 && node.classList && node.classList.contains('inline-imgwrap')){
      const capEl = node.querySelector('.imgcaption');
      parts.push(scriptImageTag(node.dataset.path, capEl ? serializeInlineContent(capEl).trim() : ''));
    } else if(node.nodeType===1 && HEADER_PREFIX[node.tagName]){
      const text = serializeInlineContent(node);
      if(text.trim()) parts.push(HEADER_PREFIX[node.tagName] + text);
    } else if(node.nodeType===1){
      const text = serializeInlineContent(node);
      if(text.trim()) parts.push(text);
    } else if(node.nodeType===3){
      if(node.textContent.trim()) parts.push(node.textContent);
    }
  });
  return parts.join('\n\n').trim();
}

// Inline image wrappers must always be direct children of the editor —
// serializeScriptEditor only recognizes them there, and populateScriptEditor
// only ever produces them there. If the caret sits mid-paragraph, inserting
// the node with Range.insertNode() would nest it inside the surrounding <p>
// alongside text nodes, and the image reference would be silently lost on
// serialize (the wrapper's remove-button text is all that survives). So
// split the paragraph in two around the caret and insert the image between
// the halves as top-level siblings instead.
function splitBlockAndInsert(editorEl, range, node){
  let blockNode = range.startContainer;
  while(blockNode && blockNode.parentNode !== editorEl){
    blockNode = blockNode.parentNode;
  }
  if(!blockNode){
    editorEl.appendChild(node);
    const r = document.createRange();
    r.setStartAfter(node); r.collapse(true);
    return r;
  }
  if(blockNode === editorEl || (blockNode.classList && blockNode.classList.contains('inline-imgwrap'))){
    // Caret directly in the editor (empty editor) or landed on an existing
    // atomic image wrapper - just drop the new node right after it.
    if(blockNode === editorEl){
      range.insertNode(node);
    } else {
      editorEl.insertBefore(node, blockNode.nextSibling);
    }
    const r = document.createRange();
    r.setStartAfter(node); r.collapse(true);
    return r;
  }
  // blockNode is a paragraph - split it at the caret, node goes in between.
  const preRange = document.createRange();
  preRange.setStart(blockNode, 0);
  preRange.setEnd(range.startContainer, range.startOffset);
  const postRange = document.createRange();
  postRange.setStart(range.startContainer, range.startOffset);
  postRange.setEnd(blockNode, blockNode.childNodes.length);

  const beforeP = document.createElement('p');
  beforeP.appendChild(preRange.cloneContents());
  const afterP = document.createElement('p');
  afterP.appendChild(postRange.cloneContents());

  function fragHasContent(el){
    return Array.from(el.childNodes).some(n=> n.nodeType===1 || (n.textContent && n.textContent.length));
  }

  const toInsert = [];
  if(fragHasContent(beforeP)) toInsert.push(beforeP);
  toInsert.push(node);
  let afterPUsed = false;
  if(fragHasContent(afterP)){ toInsert.push(afterP); afterPUsed = true; }

  toInsert.forEach(n=> editorEl.insertBefore(n, blockNode));
  editorEl.removeChild(blockNode);

  const r = document.createRange();
  if(afterPUsed) r.setStart(afterP, 0);
  else r.setStartAfter(node);
  r.collapse(true);
  return r;
}

async function insertImagesIntoScript(card, fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  if(!syncEnabled || !ghConfig){
    setSyncStatus('bad', 'Connect to GitHub in Settings before uploading images.');
    return;
  }
  const editorEl = document.getElementById('scriptEditor');
  let range = (savedEditorRange && editorEl.contains(savedEditorRange.startContainer)) ? savedEditorRange.cloneRange() : null;
  if(!range){
    range = document.createRange();
    range.selectNodeContents(editorEl);
    range.collapse(false);
  }
  const statusEl = document.getElementById('imgUploadStatus');
  for(const file of files){
    if(statusEl) statusEl.textContent = 'Uploading ' + file.name + '…';
    try{
      const base64 = await fileToBase64(file);
      const ext = safeExt(file.name);
      const path = 'data/images/' + card.id + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6) + '.' + ext;
      localImageBlobs.set(path, URL.createObjectURL(file));
      await ghPutBinaryFile(path, base64, 'Add image for card ' + card.id);
      card.images.push({path});
      const node = buildImageNode(card, path);
      range.deleteContents();
      range = splitBlockAndInsert(editorEl, range, node);
    }catch(err){
      setSyncStatus('bad', 'Image upload failed — check your GitHub connection in Settings.');
    }
  }
  if(statusEl) statusEl.textContent = '';
  ensureImageSpacers(editorEl);
  card.script = serializeScriptEditor(editorEl);
  saveToGitHub();
}

function removeInlineImageNode(card, wrapEl, path){
  wrapEl.remove();
  card.images = (card.images||[]).filter(i=>i.path!==path);
  if(localImageBlobs.has(path)){ URL.revokeObjectURL(localImageBlobs.get(path)); localImageBlobs.delete(path); }
  const editorEl = document.getElementById('scriptEditor');
  if(editorEl) card.script = serializeScriptEditor(editorEl);
  if(syncEnabled){
    ghGetFile(path).then(file=>{ if(file) ghDeleteFile(path, file.sha, 'Remove image for card ' + card.id); }).catch(()=>{});
  }
  saveToGitHub();
  if(editorEl) ensureImageSpacers(editorEl);
}

function deleteImageEverywhere(card, path){
  card.script = removeImageFromScript(card.script || '', path);
  card.images = (card.images||[]).filter(i=>i.path!==path);
  if(localImageBlobs.has(path)){ URL.revokeObjectURL(localImageBlobs.get(path)); localImageBlobs.delete(path); }
  if(syncEnabled){
    ghGetFile(path).then(file=>{
      if(file) ghDeleteFile(path, file.sha, 'Remove image for card ' + card.id);
    }).catch(()=>{});
  }
}

// The cover image is a separate single slot from the inline script images —
// it's the thumbnail Substack (and eventually other platforms) shows for the
// post, not a paragraph inside the script itself. Uploaded the same way as
// inline images (GitHub-hosted, with an instant local blob preview so it
// doesn't show broken while Pages catches up).
async function setCoverImage(card, file){
  if(!syncEnabled || !ghConfig){
    setSyncStatus('bad', 'Connect to GitHub in Settings before uploading images.');
    return;
  }
  const statusEl = document.getElementById('coverImgStatus');

    const base64 = await fileToBase64(file);
    const ext = safeExt(file.name);
    const path = 'data/images/' + card.id + '-cover-' + Date.now() + '-' + Math.random().toString(36).slice(2,6) + '.' + ext;
    localImageBlobs.set(path, URL.createObjectURL(file));
    await ghPutBinaryFile(path, base64, 'Set cover image for card ' + card.id);

}

function removeCoverImage(card){
  const oldPath = card.coverImage ? card.coverImage.path : null;
  card.coverImage = null;
  renderModal();
  saveToGitHub();
  if(oldPath && syncEnabled){

function renderModal(){
  const c = getCard();
  if(!c) return;
  const modal = document.getElementById('modal-el');
  const tagsInputVal = c.tags.join(', ');

  let sourcesHtml = c.sources.map((s,i)=>
    '<div class="source-item">' +
      '<input type="text" placeholder="Label" value="'+escapeHtml(s.label)+'" data-src-label="'+i+'">' +
      '<input type="text" placeholder="https://..." value="'+escapeHtml(s.url)+'" data-src-url="'+i+'">' +
      '<button class="small-btn" data-src-remove="'+i+'">Remove</button>' +
    '</div>').join('');

  const orphans = orphanedImages(c);
  const orphansHtml = orphans.length
    ? '<div class="field"><label>Uploaded but not placed in the script yet</label>' +
        orphans.map(img=>
          '<div class="orphan-row"><img src="'+escapeHtml(imgSrc(img.path))+'">' +
          '<button class="small-btn" data-place-img="'+escapeHtml(img.path)+'">Insert into script</button>' +
          '<button class="small-btn" data-drop-img="'+escapeHtml(img.path)+'" style="background:var(--danger-soft);color:var(--danger);">Delete</button></div>'
        ).join('') +
      '</div>'
    : '';

  let platformsHtml = '';
  if(c.stage==='distributing'){
    const {done,total} = distributionProgress(c);
    const allDone = done===total;
    platformsHtml += '<div class="field"><label>Distribution</label>';
    platformsHtml += allDone
      ? '<div class="banner done">All '+total+' platforms marked complete. Source video in Drive can be deleted 7 days after the last post — auto-delete date: <strong>'+addDays(new Date(),7)+'</strong>.</div>'
      : '<div class="banner">'+done+'/'+total+' platforms posted. This card is your live backlog for what\'s left.</div>';
    platformsHtml += '<button class="small-btn" id="genCaptions">Generate caption variants from base caption</button>';
    platformsHtml += '<div class="field" style="margin-top:8px;"><label>Base caption (usually TikTok\'s)</label><textarea id="baseCaption">'+escapeHtml(c.baseCaption)+'</textarea></div>';

    PLATFORMS.forEach(p=>{
      const st = c.platforms[p.key];
      if(p.isSubstack){
        const publishing = st.status === 'publishing';
        const coverThumb = c.coverImage
          ? '<div class="cover-image-preview" style="margin-top:8px;"><img src="'+escapeHtml(imgSrc(c.coverImage.path))+'"><span class="note">Cover image (set above)</span></div>'
          : '<div class="note" style="margin-top:8px;">No cover image set — add one at the top of this card.</div>';
        const tagNote = c.tags.length ? '<div class="note">Will post with tags: '+c.tags.map(escapeHtml).join(', ')+'</div>' : '';
        platformsHtml +=
        '<div class="platform-row"><div class="ptop"><span class="pname">'+p.label+'</span>' +
          '<select data-plat="'+p.key+'" data-field="status" '+(publishing?'disabled':'')+'>' +
            '<option value="not_started" '+(st.status==='not_started'?'selected':'')+'>Not started</option>' +
            '<option value="drafted" '+(st.status==='drafted'?'selected':'')+'>Drafted</option>' +
            '<option value="published" '+(st.status==='published'?'selected':'')+'>Published</option>' +
          '</select></div>' +
          coverThumb + tagNote +
          '<button class="small-btn" id="genSubstack" '+(publishing?'disabled':'')+'>Generate draft from script + sources</button>' +
          '<textarea style="margin-top:6px;min-height:110px;" data-plat="'+p.key+'" data-field="draft" placeholder="Substack draft...">'+escapeHtml(st.draft)+'</textarea>' +
          '<input type="text" placeholder="Published link" data-plat="'+p.key+'" data-field="link" value="'+escapeHtml(st.link)+'">' +
          '<button class="primary" id="publishSubstackBtn" style="margin-top:10px;width:100%;background:var(--danger);" '+(publishing?'disabled':'')+'>' +
            (publishing ? '⏳ Publishing…' : '🚀 Publish live to Substack') +
          '</button>' +
        '</div>';
      } else {
        const count = st.caption.length;
        const over = p.limit && count>p.limit;
        platformsHtml +=
        '<div class="platform-row"><div class="ptop"><span class="pname">'+p.label+(p.limit ? ' <span class="note">('+p.limit+' char limit)</span>':'')+'</span>' +
          '<select data-plat="'+p.key+'" data-field="status">' +
            '<option value="not_started" '+(st.status==='not_started'?'selected':'')+'>Not started</option>' +
            '<option value="posted" '+(st.status==='posted'?'selected':'')+'>Posted</option>' +
          '</select></div>' +
          '<textarea data-plat="'+p.key+'" data-field="caption" placeholder="Caption for '+p.label+'">'+escapeHtml(st.caption)+'</textarea>' +
          '<div class="charcount '+(over?'over':'')+'">'+count+(p.limit ? ' / '+p.limit : '')+'</div>' +
          '<input type="text" placeholder="Link once live" data-plat="'+p.key+'" data-field="link" value="'+escapeHtml(st.link)+'">' +
        '</div>';
      }
    });
    platformsHtml += '</div>';
  }

  modal.innerHTML =
    '<h2>Edit idea <span class="stagepill">'+STAGES.find(s=>s.key===c.stage).label+'</span></h2>' +
    '<div class="field"><label>Title</label><input type="text" id="titleInput" value="'+escapeHtml(c.title)+'"></div>' +
    '<div class="field"><label>Subtitle</label><input type="text" id="subtitleInput" value="'+escapeHtml(c.subtitle||'')+'" placeholder="Optional — shown under the title on Substack"></div>' +
    '<div class="field"><label>Cover image</label>' +
      '<input type="file" id="coverImageInput" accept="image/*" style="display:none">' +
      (c.coverImage
        ? '<div class="cover-image-preview"><img src="'+escapeHtml(imgSrc(c.coverImage.path))+'"><div class="cover-image-actions"><button class="small-btn" type="button" id="changeCoverBtn">Change</button><button class="small-btn" type="button" id="removeCoverBtn" style="background:var(--danger-soft);color:var(--danger);">Remove</button></div></div>'
        : '<button class="small-btn" type="button" id="setCoverBtn">🖼 Set cover image</button>') +
      '<span class="note" id="coverImgStatus"></span>' +
    '</div>' +
    '<div class="row">' +
      '<div class="field"><label>Stage</label><select id="stageInput">' +
        STAGES.map(s=>'<option value="'+s.key+'" '+(s.key===c.stage?'selected':'')+'>'+s.label+'</option>').join('') +
      '</select></div>' +
      '<div class="field"><label>Tags (comma separated)</label><input type="text" id="tagsInput" value="'+escapeHtml(tagsInputVal)+'"></div>' +
    '</div>' +
    '<div class="field"><label>Script</label>' +
      '<input type="file" id="scriptImageInput" accept="image/*" multiple style="display:none">' +
      '<div class="script-editor" id="scriptEditor" contenteditable="true" data-placeholder="Write your script here, or research notes if still capturing... tap Insert image to drop a screenshot or chart in wherever your cursor is."></div>' +
      '<div class="wordcount-bar"><span class="wordcount-text" id="wordcountText">0 words</span></div>' +
      orphansHtml +
      '<div class="script-toolbar">' +
        '<select id="headingSelect" title="Paragraph style" class="heading-select">' +
          '<option value="P">Normal text</option>' +
          '<option value="H1">Heading 1</option>' +
          '<option value="H2">Heading 2</option>' +
          '<option value="H3">Heading 3</option>' +
        '</select>' +
        '<button class="small-btn" type="button" id="insertImageBtn">🖼 Insert image</button>' +
        '<button class="small-btn" type="button" id="typingUndoBtn" title="Undo last typing change">&#8630; Undo</button>' +
        '<span class="note" id="imgUploadStatus"></span></div>' +
      '<div class="note">Select text for bold/italic/underline/link options.</div>' +
    '</div>' +
    '<div class="field"><label>Sources / charts / papers</label><div class="sources-list" id="sourcesList">'+sourcesHtml+'</div><button class="small-btn" id="addSource">+ Add source</button></div>' +
    platformsHtml +
    '<div class="modal-actions">' +
      '<div class="left"><button class="ghost" id="markDead">'+(c.dead ? 'Restore from archive' : "Mark: didn't pan out")+'</button>' +
      '<button class="ghost" id="deleteCard" style="color:#a3402f;border-color:#a3402f;">Delete</button></div>' +
      '<div><button class="ghost" id="closeModalBtn">Close</button><button class="primary" id="saveModal">Save</button></div>' +
    '</div>';

  document.getElementById('stageInput').onchange = ()=>{ commitModalFields(); renderModal(); };
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('saveModal').onclick = ()=>{ commitModalFields(); closeModal(); saveToGitHub(); };
  document.getElementById('addSource').onclick = ()=>{ commitModalFields(); c.sources.push({label:'',url:''}); renderModal(); };
  document.getElementById('markDead').onclick = ()=>{ commitModalFields(); c.dead = !c.dead; renderModal(); saveToGitHub(); };
  document.getElementById('deleteCard').onclick = ()=>{
    state.cards = state.cards.filter(x=>x.id!==c.id);
    closeModal();
    saveToGitHub();
  };
  populateScriptEditor(document.getElementById('scriptEditor'), c.script, c);
  const headingSelect = document.getElementById('headingSelect');
  headingSelect.addEventListener('change', ()=>{
    document.getElementById('scriptEditor').focus();
    document.execCommand('formatBlock', false, '<' + headingSelect.value.toLowerCase() + '>');
  });
  // Keep the dropdown in sync with whichever block the caret is currently in,
  // so it always shows the true current style rather than whatever was last set.
  document.getElementById('scriptEditor').addEventListener('keyup', updateHeadingSelectState);
  document.getElementById('scriptEditor').addEventListener('click', updateHeadingSelectState);
  document.getElementById('insertImageBtn').onclick = ()=> document.getElementById('scriptImageInput').click();
  const setCoverBtn = document.getElementById('setCoverBtn');
  if(setCoverBtn) setCoverBtn.onclick = ()=> document.getElementById('coverImageInput').click();
  const changeCoverBtn = document.getElementById('changeCoverBtn');
  if(changeCoverBtn) changeCoverBtn.onclick = ()=> document.getElementById('coverImageInput').click();
  const removeCoverBtn = document.getElementById('removeCoverBtn');
  if(removeCoverBtn) removeCoverBtn.onclick = ()=> removeCoverImage(c);
  const coverImageInput = document.getElementById('coverImageInput');
  if(coverImageInput) coverImageInput.onchange = (e)=>{
    if(e.target.files && e.target.files[0]) setCoverImage(c, e.target.files[0]);
    e.target.value = '';
  };
  document.getElementById('scriptImageInput').onchange = (e)=>{
    insertImagesIntoScript(c, e.target.files);
    e.target.value = '';
  };
  const typingUndoBtn = document.getElementById('typingUndoBtn');
  if(typingUndoBtn){
    typingUndoBtn.addEventListener('mousedown', (e)=>e.preventDefault()); // don't steal focus/selection from the field being corrected
    typingUndoBtn.addEventListener('click', triggerTypingUndo);
  }
  modal.addEventListener('focusin', (e)=>{
    const t = e.target;
    if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.id==='scriptEditor' || (t.classList && t.classList.contains('imgcaption')))) lastFocusedEditable = t;
  });
  modal.querySelectorAll('[data-place-img]').forEach(btn=>{
    btn.onclick = ()=>{
      commitModalFields();
      c.script = (c.script ? c.script.trim() + '\n\n' : '') + scriptImageTag(btn.dataset.placeImg) + '\n\n';
      renderModal();
      saveToGitHub();
    };
  });
  modal.querySelectorAll('[data-drop-img]').forEach(btn=>{
    btn.onclick = ()=>{ commitModalFields(); deleteImageEverywhere(c, btn.dataset.dropImg); renderModal(); saveToGitHub(); };
  });
  modal.querySelectorAll('[data-src-remove]').forEach(btn=>{
    btn.onclick = ()=>{ commitModalFields(); c.sources.splice(+btn.dataset.srcRemove,1); renderModal(); };
  });

  const genCaptions = document.getElementById('genCaptions');
  if(genCaptions) genCaptions.onclick = ()=>{ commitModalFields(); generateCaptionVariants(c); renderModal(); };
  const genSubstack = document.getElementById('genSubstack');
  if(genSubstack) genSubstack.onclick = ()=>{ commitModalFields(); c.platforms.substack.draft = generateSubstackDraft(c); renderModal(); };
  const publishSubstackBtn = document.getElementById('publishSubstackBtn');
  if(publishSubstackBtn) publishSubstackBtn.onclick = ()=>{ commitModalFields(); openSubstackConfirm(c); };

  modal.querySelectorAll('textarea[data-plat]').forEach(ta=>{
    ta.addEventListener('input', ()=>{
      const row = ta.closest('.platform-row');
      const cc = row.querySelector('.charcount');
      if(cc){
        const limit = PLATFORMS.find(p=>p.key===ta.dataset.plat).limit;
        cc.textContent = ta.value.length + (limit ? ' / '+limit : '');
        cc.classList.toggle('over', !!(limit && ta.value.length>limit));
      }
    });
  });
}

function commitModalFields(){
  const c = getCard();
  if(!c) return;
  c.title = document.getElementById('titleInput').value || 'Untitled idea';
  const subtitleEl = document.getElementById('subtitleInput');
  if(subtitleEl) c.subtitle = subtitleEl.value;
  c.stage = document.getElementById('stageInput').value;
  c.tags = document.getElementById('tagsInput').value.split(',').map(t=>t.trim()).filter(Boolean);
  const editorEl = document.getElementById('scriptEditor');
  if(editorEl) c.script = serializeScriptEditor(editorEl);

  document.querySelectorAll('#sourcesList .source-item').forEach((row,i)=>{
    if(!c.sources[i]) return;
    c.sources[i].label = row.querySelector('[data-src-label]').value;
    c.sources[i].url = row.querySelector('[data-src-url]').value;
  });

  const baseCapEl = document.getElementById('baseCaption');
  if(baseCapEl) c.baseCaption = baseCapEl.value;

  document.querySelectorAll('[data-plat]').forEach(el=>{
    const key = el.dataset.plat, field = el.dataset.field;
    if(c.platforms[key]) c.platforms[key][field] = el.value;
  });
}

document.addEventListener('click', e=>{
  if(e.target && e.target.id === 'overlay-el') closeModal();
  if(e.target && e.target.id === 'substackConfirmOverlay-el') closeSubstackConfirm();
});

initSync();
</script>

</body>
</html>
