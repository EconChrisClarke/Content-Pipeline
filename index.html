<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette and type match Christopher's econ-chart-style house brand:
     brand red #C71E1D, navy/amber/teal/plum as the series colors, the
     "house rose" #FFF1F2 background, Fraunces for display type, Inter for
     body. --danger deliberately stays its own color rather than reusing
     brand red — the style spec is explicit that the red is a neutral brand
     mark, not a "bad" signal, so true error states need a color of their own. */
  :root{
    --paper:#fff1f2; --surface:#ffffff; --ink:#111827; --ink-soft:#6b7280;
    --line:#e4d8db; --accent:#c71e1d; --accent-soft:#f2e5e7;
    --gold:#e8a33d; --gold-soft:#fcf1e2; --danger:#a13d2e; --danger-soft:#f5ddd6;
    --stage-capture:#6b7280; --stage-scripted:#2e8b7a; --stage-dist:#1b3a5c;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1b1615; --surface:#241c1a; --ink:#f2e8e6; --ink-soft:#b9a9a5;
      --line:#3a2d2a; --accent:#ef5b52; --accent-soft:#3a201d;
      --gold:#f0b968; --gold-soft:#3a2c15; --danger:#e0836f; --danger-soft:#3a231e;
      --stage-capture:#b9a9a5; --stage-scripted:#5fc2ae; --stage-dist:#6f93bd;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1b1615; --surface:#241c1a; --ink:#f2e8e6; --ink-soft:#b9a9a5;
    --line:#3a2d2a; --accent:#ef5b52; --accent-soft:#3a201d;
    --gold:#f0b968; --gold-soft:#3a2c15; --danger:#e0836f; --danger-soft:#3a231e;
    --stage-capture:#b9a9a5; --stage-scripted:#5fc2ae; --stage-dist:#6f93bd;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);}
  header{padding:20px 26px 8px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:25;}
  header .titlerow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  header h1{margin:0 0 3px;font-family:var(--font-display);font-weight:600;font-size:23px;letter-spacing:.01em;text-wrap:balance;}
  header p{margin:0 0 9px;color:var(--ink-soft);font-size:13px;}
  .syncline{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);padding-bottom:11px;display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);display:inline-block;flex-shrink:0;}
  .dot.ok{background:var(--accent);}
  .dot.bad{background:var(--danger);}
  .toolbar{display:flex;gap:10px;align-items:center;padding:12px 26px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:74px;z-index:4;}
  .searchbox{flex:1 1 200px;min-width:160px;}
  .searchbox input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;font-family:var(--font-body);background:var(--paper);color:var(--ink);}
  .tagfilter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .tag-search-input{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-family:var(--font-body);background:var(--paper);color:var(--ink);min-width:110px;flex:0 1 140px;}
  .chip-more{background:transparent;border-style:dashed;cursor:pointer;font-style:italic;}
  .chip-more:hover{background:var(--accent-soft);}
  .chip{border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;user-select:none;}
  .chip.active{background:var(--accent);color:var(--surface);border-color:var(--accent);}
  .spacer{flex:1;}
  .quickadd{display:flex;gap:6px;flex:1 1 260px;min-width:220px;}
  .quickadd input{flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;font-family:var(--font-body);background:var(--paper);color:var(--ink);}
  button.primary{background:var(--accent);color:var(--surface);border:none;border-radius:7px;padding:9px 16px;font-size:13.5px;font-weight:600;font-family:var(--font-body);cursor:pointer;white-space:nowrap;}
  button.primary:hover{opacity:.88;}
  button.primary:disabled{opacity:.5;cursor:default;}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:8px 14px;font-size:13px;font-family:var(--font-body);cursor:pointer;white-space:nowrap;}
  button.ghost:hover{background:var(--accent-soft);}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .chip:focus-visible, .card:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px 26px;align-items:start;}
  @media (max-width:1000px){.board{grid-template-columns:1fr 1fr;}}
  @media (max-width:600px){.board{grid-template-columns:1fr;}}
  .col{background:var(--surface);border-radius:4px;padding:12px 11px;min-height:120px;border-top:3px solid var(--stage-capture);}
  .col:nth-of-type(2){border-top-color:var(--stage-scripted);}
  .col:nth-of-type(3){border-top-color:var(--stage-dist);}
  .col h2{font-family:var(--font-display);font-weight:600;font-size:14.5px;margin:2px 3px 12px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;}
  .col h2 span.count{font-family:var(--font-mono);color:var(--ink-soft);font-weight:500;font-variant-numeric:tabular-nums;font-size:12px;}
  .card{background:var(--paper);border-radius:5px;padding:11px 12px;margin-bottom:9px;cursor:pointer;border:1px solid var(--line);}
  .card:hover{border-color:var(--accent);}
  .card h3{margin:0 0 6px;font-family:var(--font-display);font-size:14.5px;font-weight:600;line-height:1.32;text-wrap:balance;}
  .card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;}
  .tag{font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:3px;color:#fff;letter-spacing:.01em;}
  .card .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .card .thumbrow{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
  .card .thumbrow img{width:36px;height:36px;object-fit:cover;border-radius:4px;border:1px solid var(--line);}
  .progress{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden;}
  .progress > div{height:100%;background:var(--accent);}
  .empty{color:var(--ink-soft);font-size:12px;padding:10px 6px;font-style:italic;}
  .archive-toggle{padding:14px 26px;color:var(--ink-soft);font-size:13px;cursor:pointer;font-family:var(--font-mono);}
  .archive{padding:0 26px 26px;}
  .archive .card{opacity:.68;}
  /* Must render above the sticky header (z-index:25) — otherwise the header
     stays pinned on top of the modal's own top edge (title, and depending on
     viewport height, the script box) instead of being covered by it like the
     rest of the page. */
  .overlay{position:fixed;inset:0;background:rgba(20,18,12,.5);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:30;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:8px;max-width:640px;width:100%;padding:24px 26px 28px;margin-bottom:40px;border:1px solid var(--line);}
  .modal h2{margin:0 0 16px;font-family:var(--font-display);font-weight:600;font-size:19px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;}
  .field input[type=text], .field input[type=password], .field textarea, .field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:var(--font-body);background:var(--paper);color:var(--ink);}
  .field textarea{min-height:90px;resize:vertical;}
  .field .hint{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-top:5px;}
  .row{display:flex;gap:10px;}
  .row > div{flex:1;}
  .sources-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
  .source-item{display:flex;gap:6px;align-items:center;}
  .source-item input{flex:1;}
  .small-btn{background:var(--accent-soft);border:none;color:var(--accent);border-radius:5px;padding:6px 10px;font-size:12px;font-family:var(--font-body);font-weight:500;cursor:pointer;white-space:nowrap;}
  .small-btn:disabled{opacity:.5;cursor:default;}
  .platform-row{border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin-bottom:8px;}
  .platform-row .ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .platform-row .pname{font-weight:600;font-size:13px;}
  .platform-row select{width:auto;padding:5px 8px;font-size:12px;}
  .platform-row textarea{min-height:52px;font-size:12.5px;}
  .platform-row input[type=text]{font-size:12px;margin-top:6px;}
  .charcount{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);text-align:right;margin-top:2px;font-variant-numeric:tabular-nums;}
  .charcount.over{color:var(--danger);font-weight:600;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap;}
  .modal-actions .left{display:flex;gap:8px;flex-wrap:wrap;}
  .banner{background:var(--gold-soft);color:var(--gold);border-radius:6px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;}
  .banner.done{background:var(--accent-soft);color:var(--accent);}
  .banner.bad{background:var(--danger-soft);color:var(--danger);}
  .note{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .stagepill{display:inline-block;font-family:var(--font-mono);font-size:11px;padding:3px 9px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-left:8px;vertical-align:middle;}
  .imagegrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .imagegrid .imgwrap{position:relative;width:84px;height:84px;}
  .imagegrid img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .imagegrid .imgwrap.uploading img{opacity:.4;}
  .imagegrid .imgwrap.uploading::after{content:"…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);color:var(--ink-soft);}
  .imagegrid .rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1;}
  .script-toolbar{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .script-editor{width:100%;min-height:340px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;line-height:1.55;font-family:var(--font-body);background:var(--paper);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;}
  .script-editor:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .script-editor p{margin:0 0 10px;}
  .script-editor p:last-child{margin-bottom:0;}
  .script-editor:empty:before{content:attr(data-placeholder);color:var(--ink-soft);pointer-events:none;}
  .script-editor h1, .script-editor h2, .script-editor h3{font-family:var(--font-display);font-weight:700;line-height:1.25;margin:14px 0 8px;color:var(--ink);}
  .script-editor h1:first-child, .script-editor h2:first-child, .script-editor h3:first-child{margin-top:0;}
  .script-editor h1{font-size:1.55em;}
  .script-editor h2{font-size:1.32em;}
  .script-editor h3{font-size:1.14em;}
  .heading-select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:var(--font-body);background:var(--paper);color:var(--ink);}
  .inline-imgwrap{position:relative;margin:10px 0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
  /* Extra-specific selector (three classes) needed to outrank the generic
     ".field input[type=text]" rule above, which would otherwise paint this
     like an ordinary boxed field instead of plain Substack-style caption text.
     The caption is a contenteditable div (not an <input>) so it can hold a
     real inline <a class="scriptlink"> the same way script paragraphs can —
     same Ctrl/Cmd+K / right-click / selection-toolbar hyperlink feature works
     inside it. */
  .script-editor .inline-imgwrap .imgcaption{display:block;width:100%;margin-top:6px;padding:2px 6px;border:none;border-bottom:1px solid transparent;background:transparent;color:var(--ink-soft);font-family:var(--font-body);font-style:italic;font-size:12.5px;line-height:1.4;text-align:center;-webkit-user-select:text;user-select:text;}
  .script-editor .inline-imgwrap .imgcaption:focus{outline:none;border-bottom-color:var(--line);}
  .script-editor .inline-imgwrap .imgcaption:empty:before{content:attr(data-placeholder);color:var(--ink-soft);opacity:.6;font-style:italic;pointer-events:none;}
  /* Word-processor-style hyperlinks inside the script text (and, per above,
     inside image captions too): select text, then Ctrl/Cmd+K, right-click,
     or the floating selection toolbar that appears on any text selection. */
  .script-editor a.scriptlink{color:var(--accent);text-decoration:underline;text-decoration-color:var(--accent-soft);}
  .selection-toolbar{position:fixed;z-index:31;display:flex;gap:2px;background:var(--ink);border-radius:8px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.32);}
  .selection-toolbar-btn{background:none;border:none;color:var(--paper);border-radius:5px;padding:6px 10px;font-size:14px;font-family:var(--font-body);cursor:pointer;white-space:nowrap;}
  .selection-toolbar-btn:hover{background:rgba(255,255,255,.15);}
  .selection-toolbar-btn.active{background:rgba(255,255,255,.28);}
  .link-popover{position:fixed;z-index:32;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.32);padding:8px;display:flex;gap:6px;align-items:center;max-width:min(340px,92vw);}
  .link-popover input[type=url]{flex:1;min-width:140px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font-size:13px;font-family:var(--font-body);background:var(--paper);color:var(--ink);}
  .link-popover button{padding:7px 11px;}
  .inline-image{max-width:100%;border-radius:6px;border:1px solid var(--line);display:block;pointer-events:none;-webkit-touch-callout:none;-webkit-user-drag:none;}
  .inline-imgwrap .rm{position:absolute;top:6px;right:6px;}
  .img-longpress-menu{position:absolute;left:50%;top:6px;transform:translateX(-50%);display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 7px;box-shadow:0 3px 10px rgba(0,0,0,.28);z-index:6;}
  .img-longpress-menu button{min-width:36px;}
  .cropstage{position:relative;max-width:100%;margin:6px auto 14px;background:#000;touch-action:none;}
  .cropstage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;}
  .croprect{position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,.5);cursor:move;touch-action:none;}
  .crophandle{position:absolute;width:24px;height:24px;background:var(--accent);border-radius:50%;border:2px solid #fff;touch-action:none;}
  .crophandle.nw{left:-12px;top:-12px;cursor:nwse-resize;}
  .crophandle.ne{right:-12px;top:-12px;cursor:nesw-resize;}
  .crophandle.sw{left:-12px;bottom:-12px;cursor:nesw-resize;}
  .crophandle.se{right:-12px;bottom:-12px;cursor:nwse-resize;}
  .orphan-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .orphan-row img{width:40px;height:40px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex-shrink:0;}
  .cover-image-preview{display:flex;gap:10px;align-items:center;margin-bottom:4px;}
  .cover-image-preview img{width:100px;height:66px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex-shrink:0;}
  .cover-image-actions{display:flex;gap:6px;flex-wrap:wrap;}
  /* Word count sits directly under the script box (not down in the general
     toolbar row) specifically so it's visible without scrolling while
     writing — that's the whole point of the feature. */
  .wordcount-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;}
  .wordcount-text{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .wordcount-text.status-ok{color:var(--accent);font-weight:600;}
  .wordcount-text.status-low, .wordcount-text.status-high{color:var(--gold);font-weight:600;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;} }
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="titlerow">
      <div>
        <h1>Content Pipeline</h1>
        <p>Capture &rarr; Scripted &amp; Filmed &rarr; Distributing &mdash; one board, no folders, tags for topics.</p>
      </div>
      <button class="ghost" id="settingsBtn">Settings</button>
    </div>
    <div class="syncline" id="syncline"><span class="dot" id="syncdot"></span><span id="syncmsg">Checking sync&hellip;</span></div>
  </header>

  <div class="toolbar">
    <div class="quickadd">
      <input type="text" id="quickInput" placeholder="Plop an idea in&hellip; (title only, refine later)">
      <button class="primary" id="quickAdd">Add</button>
    </div>
    <div class="searchbox"><input type="text" id="searchInput" placeholder="Search titles, scripts, tags, sources&hellip;"></div>
    <input type="text" id="tagSearchInput" class="tag-search-input" placeholder="Filter tags&hellip;">
    <div class="tagfilter" id="tagfilter"></div>
    <div class="spacer"></div>
    <button class="ghost" id="clearFilter">Clear filters</button>
  </div>

  <div class="board" id="board"></div>

  <div class="archive-toggle" id="archiveToggle">&#9656; Didn't pan out (0)</div>
  <div class="archive" id="archive" style="display:none;"></div>

  <div class="overlay" id="overlay-el">
    <div class="modal" id="modal-el"></div>
  </div>
  <div class="overlay" id="cropOverlay-el" style="z-index:35;">
    <div class="modal" id="cropModal-el" style="max-width:520px;"></div>
  </div>
  <div class="overlay" id="substackConfirmOverlay-el" style="z-index:36;">
    <div class="modal" id="substackConfirmModal-el" style="max-width:560px;"></div>
  </div>
</div>

<script>
const STAGES = [
  {key:'capture', label:'Capture'},
  {key:'scripted', label:'Scripted & Filmed'},
  {key:'distributing', label:'Distributing'}
];

// Cards saved back when the board had a 'researching' stage need to land
// somewhere now that the column is gone — migrated forward to 'scripted'
// rather than back to 'capture', since reaching the researching stage meant
// the idea had already moved past the raw-idea pile.
function migrateLegacyStages(cards){
  (cards||[]).forEach(c=>{ if(c.stage === 'researching') c.stage = 'scripted'; });
  return cards;
}

const PLATFORMS = [
  {key:'tiktok',     label:'TikTok',                 hashtags:true,  limit:null},
  {key:'instagram',  label:'Instagram / Threads / FB',hashtags:true,  limit:null},
  {key:'x',          label:'X',                       hashtags:false, limit:280},
  {key:'youtube',    label:'YouTube',                 hashtags:false, limit:null},
  {key:'bsky',       label:'Bluesky',                 hashtags:false, limit:300},
  {key:'substack',   label:'Substack',                hashtags:false, limit:null, isSubstack:true}
];

const TAG_PALETTE = ['#3d5a4c','#a9642f','#4a5a7a','#7a4a5a','#5a7a4a','#7a5a4a','#4a6a7a','#7a4a6a'];
function tagColor(t){
  let h=0; for(const c of t) h = (h*31 + c.charCodeAt(0)) % 997;
  return TAG_PALETTE[h % TAG_PALETTE.length];
}

// ============================================================
// GitHub-backed persistence
// Data lives at data/cards.json in the repo. Images live under
// data/images/. Config (owner/repo/branch/token) is entered once
// per device and kept only in that device's localStorage — never
// baked into this file, so the public page carries no secret.
// ============================================================

const CONFIG_KEY = 'cp_github_config_v1';
const LS_FALLBACK_KEY = 'cp_fallback_cards_v1';
const DATA_PATH = 'data/cards.json';

function loadConfig(){
  try{ return JSON.parse(localStorage.getItem(CONFIG_KEY)) || null; }catch(e){ return null; }
}
function saveConfig(cfg){
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
}
let ghConfig = loadConfig();
let cardsSha = null; // current known sha of data/cards.json, for conflict-safe writes

function ghHeaders(){
  return {
    'Authorization': 'Bearer ' + ghConfig.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}
function ghApiUrl(path){
  return 'https://api.github.com/repos/' + ghConfig.owner + '/' + ghConfig.repo + '/contents/' + path;
}
function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(escape(atob(str)));
}

async function ghGetFile(path){
  const res = await fetch(ghApiUrl(path) + '?ref=' + encodeURIComponent(ghConfig.branch), {headers: ghHeaders()});
  if(res.status === 404) return null;
  if(!res.ok) throw {code:'http_'+res.status, message: await res.text()};
  return res.json();
}
async function ghPutFile(path, contentStr, message, sha){
  const body = {message, content: b64EncodeUnicode(contentStr), branch: ghConfig.branch};
  if(sha) body.sha = sha;
  const res = await fetch(ghApiUrl(path), {method:'PUT', headers: Object.assign({'Content-Type':'application/json'}, ghHeaders()), body: JSON.stringify(body)});
  if(!res.ok){
    const text = await res.text();
    let code = 'http_'+res.status;
    if(res.status === 409 || res.status === 422) code = 'conflict';
    if(res.status === 401 || res.status === 403) code = 'auth';
    throw {code, message: text};
  }
  return res.json();
}
async function ghPutBinaryFile(path, base64Content, message){
  const body = {message, content: base64Content, branch: ghConfig.branch};
  const res = await fetch(ghApiUrl(path), {method:'PUT', headers: Object.assign({'Content-Type':'application/json'}, ghHeaders()), body: JSON.stringify(body)});
  if(!res.ok){
    const text = await res.text();
    let code = 'http_'+res.status;
    if(res.status === 401 || res.status === 403) code = 'auth';
    throw {code, message: text};
  }
  return res.json();
}
async function ghDeleteFile(path, sha, message){
  const res = await fetch(ghApiUrl(path), {method:'DELETE', headers: Object.assign({'Content-Type':'application/json'}, ghHeaders()), body: JSON.stringify({message, sha, branch: ghConfig.branch})});
  return res.ok;
}

function setSyncStatus(mode, text){
  const dot = document.getElementById('syncdot');
  const msg = document.getElementById('syncmsg');
  dot.className = 'dot' + (mode==='ok' ? ' ok' : mode==='bad' ? ' bad' : '');
  msg.textContent = text;
}

function loadFallbackCards(){
  try{
    const raw = localStorage.getItem(LS_FALLBACK_KEY);
    if(raw){ const p = JSON.parse(raw); if(Array.isArray(p)) return migrateLegacyStages(p); }
  }catch(e){}
  return [];
}
function saveFallbackCards(cards){
  try{ localStorage.setItem(LS_FALLBACK_KEY, JSON.stringify(cards)); }catch(e){}
}

let state = { cards: loadFallbackCards() };
let activeFilters = new Set();
let searchQuery = '';
let openCardId = null;
let syncEnabled = false;
// Instant local previews for images uploaded this session, keyed by GitHub
// path. GitHub Pages can take 30-60s to actually start serving a file right
// after it's committed, so pointing straight at the GitHub path immediately
// after upload shows a broken image icon. A local blob URL sidesteps that —
// it's this browser's own copy of the file, no network round-trip needed.
let localImageBlobs = new Map();
function imgSrc(path){ return localImageBlobs.has(path) ? localImageBlobs.get(path) : path; }

// ---- undo (typing corrections) ----
// Just a mobile-friendly trigger for the browser's own per-keystroke undo
// history on whichever text field was last being typed in — title, tags,
// script, captions, etc. Not an app-level "undo my last save/delete/image
// edit" system: card adds/deletes are rare and easy enough to redo by hand,
// so this only needs to catch ordinary typos while writing. Ctrl+Z/Cmd+Z
// already does this natively with a keyboard; the button exists because
// mobile has no Ctrl key. Lives at the bottom of the script area, right
// where the typing happens.
let lastFocusedEditable = null;
// Chromium keeps a single undo stack shared by every editable region on the
// page. Calling execCommand('undo') on a field that has no local history of
// its own (never actually edited — just focused, or freshly populated by
// populateScriptEditor/renderModal) falls back to that shared stack and can
// silently revert an edit in a totally unrelated field elsewhere on the page
// (e.g. the header's quick-add box), stealing focus there in the process —
// exactly the opposite of "stay put so the user can keep typing". So track
// which fields have actually received a real edit, and only ever fire
// execCommand on one of those; otherwise just focus the target and stop.
let editedFields = new WeakSet();
document.addEventListener('input', (e)=>{
  const t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.id==='scriptEditor' || (t.classList && t.classList.contains('imgcaption')))) editedFields.add(t);
  if(t && t.id === 'scriptEditor') updateWordCountBar(t);
});

// ---- word count / speaking-pace target ----
// Fixed pace estimate (no in-app calibration tool anymore — just a flat
// assumption of how fast the user talks) used both to size the word target
// for a fixed-length script and to translate the current word count into an
// estimated spoken duration.
const WPM = 185;
const TARGET_MINUTES = 3;

function targetWordCount(){
  return Math.round(WPM * TARGET_MINUTES);
}
// Counts only the words that will actually get spoken on camera: plain
// script paragraphs, not image blocks — a caption under an image is a
// Substack-style visual caption, not narration, so it shouldn't inflate the
// count. Walking the live rendered DOM (rather than the serialized
// markdown) means a hyperlink's visible label counts as its own words, not
// the raw [label](url) syntax around it.
function countScriptWords(editorEl){
  let text = '';
  editorEl.childNodes.forEach(node=>{
    if(node.nodeType===1 && node.classList && node.classList.contains('inline-imgwrap')) return;
    text += (node.textContent || '') + ' ';
  });
  const m = text.match(/\S+/g);
  return m ? m.length : 0;
}
function formatClock(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60), s = totalSec % 60;
  return m + ':' + String(s).padStart(2,'0');
}
function updateWordCountBar(editorEl){
  const textEl = document.getElementById('wordcountText');
  if(!textEl) return;
  const count = countScriptWords(editorEl);
  const target = targetWordCount();
  // ±10% band around the target reads as "on pace" — nobody hits an exact
  // word count while talking naturally, and a hard cutoff would nag over
  // nothing.
  const low = Math.round(target * 0.9);
  const high = Math.round(target * 1.1);
  let status = 'neutral';
  if(count > 0) status = (count >= low && count <= high) ? 'ok' : (count < low ? 'low' : 'high');
  textEl.className = 'wordcount-text status-' + status;
  const estMs = (count / WPM) * 60000;
  textEl.textContent = count + ' word' + (count===1 ? '' : 's') + '. Est ' + formatClock(estMs) + ' · target ~' + target + ' for ' + TARGET_MINUTES + ':00';
}
function updateHeadingSelectState(){
  const sel = document.getElementById('headingSelect');
  if(!sel) return;
  let block = 'p';
  try{ block = (document.queryCommandValue('formatBlock') || 'p').toLowerCase(); }catch(e){}
  sel.value = ['h1','h2','h3'].includes(block) ? block.toUpperCase() : 'P';
}

function triggerTypingUndo(){
  const fallback = document.getElementById('scriptEditor');
  const target = (lastFocusedEditable && document.body.contains(lastFocusedEditable)) ? lastFocusedEditable : fallback;
  if(target && target.focus) target.focus();
  if(target && editedFields.has(target)) document.execCommand('undo');
}

async function loadFromGitHub(){
  setSyncStatus('', 'Connecting to GitHub…');
  try{
    const file = await ghGetFile(DATA_PATH);
    if(file){
      const json = JSON.parse(b64DecodeUnicode(file.content));
      state.cards = migrateLegacyStages(Array.isArray(json.cards) ? json.cards : []);
      cardsSha = file.sha;
    } else {
      // no data file yet - this is a brand new repo, start empty and create it on first save
      state.cards = [];
      cardsSha = null;
    }
    syncEnabled = true;
    setSyncStatus('ok', 'Synced with ' + ghConfig.owner + '/' + ghConfig.repo + ' — open this same page on any device to see the same board.');
  }catch(err){
    syncEnabled = false;
    if(err.code === 'auth'){
      setSyncStatus('bad', 'GitHub rejected this token — open Settings and check it.');
    } else {
      setSyncStatus('bad', "Can't reach GitHub right now — showing your last local copy. Changes will retry on next save.");
    }
  }
  render();
}

async function saveToGitHub(){
  saveFallbackCards(state.cards);
  if(!syncEnabled || !ghConfig){ render(); return; }
  setSyncStatus('', 'Saving…');
  const payload = JSON.stringify({cards: state.cards}, null, 2);
  try{
    const result = await ghPutFile(DATA_PATH, payload, 'Update cards.json', cardsSha);
    cardsSha = result.content.sha;
    setSyncStatus('ok', 'Synced with ' + ghConfig.owner + '/' + ghConfig.repo + ' — open this same page on any device to see the same board.');
  }catch(err){
    if(err.code === 'conflict'){
      // someone/something else saved first - refetch the latest and retry once
      setSyncStatus('', 'Newer version found — merging…');
      try{
        const file = await ghGetFile(DATA_PATH);
        cardsSha = file ? file.sha : null;
        const result = await ghPutFile(DATA_PATH, payload, 'Update cards.json', cardsSha);
        cardsSha = result.content.sha;
        setSyncStatus('ok', 'Synced with ' + ghConfig.owner + '/' + ghConfig.repo + '.');
      }catch(err2){
        setSyncStatus('bad', "Couldn't save after a conflict — your change is kept locally, try again in a moment.");
      }
    } else if(err.code === 'auth'){
      setSyncStatus('bad', 'GitHub rejected this token — open Settings and check it. Your change is kept locally.');
    } else {
      setSyncStatus('bad', "Couldn't reach GitHub — your change is kept locally and will sync on your next edit.");
    }
  }
  render();
}

// Reconnecting (e.g. re-opening Settings and hitting Connect) must never
// silently discard cards that only exist locally because an earlier save
// failed to reach GitHub. Merge by id instead of blindly overwriting:
// local wins on conflicts (it's the freshest edit on this device), any
// card that only exists on GitHub is kept too, then the merged result is
// written straight back so both sides agree.
async function connectAndMerge(){
  setSyncStatus('', 'Connecting to GitHub…');
  const localCards = state.cards;
  try{
    const file = await ghGetFile(DATA_PATH);
    let remoteCards = [];
    if(file){
      const json = JSON.parse(b64DecodeUnicode(file.content));
      remoteCards = Array.isArray(json.cards) ? json.cards : [];
      cardsSha = file.sha;
    } else {
      cardsSha = null;
    }
    const byId = new Map(remoteCards.map(c=>[c.id, c]));
    localCards.forEach(c=>byId.set(c.id, c)); // local wins on id collision
    state.cards = migrateLegacyStages([...byId.values()]);
    syncEnabled = true;
    await saveToGitHub(); // push the merged result so GitHub matches what's on screen
  }catch(err){
    // Couldn't even reach GitHub to merge — keep the local copy exactly as-is,
    // don't touch state.cards, and let the next successful save reconcile it.
    state.cards = localCards;
    syncEnabled = false;
    if(err.code === 'auth'){
      setSyncStatus('bad', 'GitHub rejected this token — open Settings and check it. Nothing was lost, still showing your local copy.');
    } else {
      setSyncStatus('bad', "Can't reach GitHub right now — still showing your local copy, nothing was lost. Try Settings again once you have a connection.");
    }
    render();
  }
}

async function initSync(){
  if(!ghConfig || !ghConfig.owner || !ghConfig.repo || !ghConfig.token){
    setSyncStatus('bad', 'Not connected yet — open Settings to link your GitHub repo.');
    render();
    openSettings(true);
    return;
  }
  await loadFromGitHub();
}

// ---- data model ----

function newPlatformState(){
  const o = {};
  PLATFORMS.forEach(p=>{
    o[p.key] = p.isSubstack
      ? {status:'not_started', draft:'', link:''}
      : {status:'not_started', caption:'', link:''};
  });
  return o;
}

function makeCard(overrides){
  return Object.assign({
    id: 'c'+Math.random().toString(36).slice(2,9),
    title: 'Untitled idea',
    subtitle: '',
    tags: [],
    stage: 'capture',
    dead: false,
    script: '',
    sources: [],
    images: [],
    coverImage: null,
    baseCaption: '',
    platforms: newPlatformState(),
    createdAt: new Date().toISOString().slice(0,10)
  }, overrides);
}

function allTags(){
  const s = new Set();
  state.cards.forEach(c=>c.tags.forEach(t=>s.add(t)));
  return [...s].sort();
}

function distributionProgress(card){
  const total = PLATFORMS.length;
  const done = PLATFORMS.filter(p=>{
    const st = card.platforms[p.key].status;
    return p.isSubstack ? st==='published' : st==='posted';
  }).length;
  return {done, total};
}

function cardHaystack(c){
  return [
    c.title, c.script, c.baseCaption,
    c.tags.join(' '),
    c.sources.map(s=>s.label+' '+s.url).join(' ')
  ].join(' ').toLowerCase();
}

function cardMatchesFilter(c){
  if(activeFilters.size && !c.tags.some(t=>activeFilters.has(t))) return false;
  if(searchQuery && !cardHaystack(c).includes(searchQuery.toLowerCase())) return false;
  return true;
}

// ---- rendering ----

// A tag list grows without bound over the life of the board, so the chip row
// can't just show every tag forever — it would eventually crowd out the
// board itself. Two things keep it bounded: a small search box that narrows
// the chips shown to a typed substring, and (when not searching) a cap at
// TAG_LIMIT chips, most-used first, with a "+N more" toggle to see the rest.
// An already-active filter chip is always kept visible even under a search,
// so applying a filter can never make its own chip disappear.
let tagFilterQuery = '';
let tagFilterExpanded = false;
const TAG_LIMIT = 12;

function tagUseCounts(){
  const counts = {};
  state.cards.forEach(c=>c.tags.forEach(t=>{ counts[t] = (counts[t]||0) + 1; }));
  return counts;
}

function renderTagFilter(){
  const el = document.getElementById('tagfilter');
  el.innerHTML = '';
  const counts = tagUseCounts();
  const q = tagFilterQuery.trim().toLowerCase();
  let tags = allTags();
  if(q) tags = tags.filter(t => t.toLowerCase().includes(q) || activeFilters.has(t));
  tags.sort((a,b) => (counts[b]-counts[a]) || a.localeCompare(b));
  const overflow = !tagFilterExpanded && !q && tags.length > TAG_LIMIT;
  const shown = overflow ? tags.slice(0, TAG_LIMIT) : tags;

  shown.forEach(t=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeFilters.has(t) ? ' active' : '');
    chip.textContent = t;
    chip.style.borderColor = activeFilters.has(t) ? tagColor(t) : '';
    chip.style.background = activeFilters.has(t) ? tagColor(t) : '';
    chip.onclick = ()=>{
      activeFilters.has(t) ? activeFilters.delete(t) : activeFilters.add(t);
      render();
    };
    el.appendChild(chip);
  });

  if(overflow){
    const more = document.createElement('div');
    more.className = 'chip chip-more';
    more.textContent = '+' + (tags.length - TAG_LIMIT) + ' more';
    more.onclick = ()=>{ tagFilterExpanded = true; render(); };
    el.appendChild(more);
  } else if(tagFilterExpanded && !q && tags.length > TAG_LIMIT){
    const less = document.createElement('div');
    less.className = 'chip chip-more';
    less.textContent = 'Show fewer';
    less.onclick = ()=>{ tagFilterExpanded = false; render(); };
    el.appendChild(less);
  }
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function cardEl(c){
  const div = document.createElement('div');
  div.className = 'card';
  div.onclick = ()=>openModal(c.id);
  const tagsHtml = c.tags.map(t=>'<span class="tag" style="background:'+tagColor(t)+'">'+escapeHtml(t)+'</span>').join('');
  let extra = '';
  if(c.stage==='distributing'){
    const {done,total} = distributionProgress(c);
    extra = '<div class="progress"><div style="width:'+((done/total)*100)+'%"></div></div><div class="meta" style="margin-top:4px;">'+done+'/'+total+' platforms</div>';
  }
  let thumbs = '';
  if(c.images && c.images.length){
    thumbs = '<div class="thumbrow">' + c.images.slice(0,4).map(img=>'<img src="'+escapeHtml(imgSrc(img.path))+'" loading="lazy">').join('') + '</div>';
  }
  div.innerHTML = '<h3>'+escapeHtml(c.title)+'</h3><div class="tags">'+tagsHtml+'</div><div class="meta">'+c.createdAt+'</div>'+thumbs+extra;
  return div;
}

function render(){
  renderTagFilter();
  const board = document.getElementById('board');
  board.innerHTML = '';
  STAGES.forEach(stage=>{
    const col = document.createElement('div');
    col.className = 'col';
    const cards = state.cards.filter(c=>!c.dead && c.stage===stage.key && cardMatchesFilter(c));
    col.innerHTML = '<h2>'+stage.label+' <span class="count">'+cards.length+'</span></h2>';
    if(cards.length===0){
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Nothing here';
      col.appendChild(e);
    } else {
      cards.forEach(c=>col.appendChild(cardEl(c)));
    }
    board.appendChild(col);
  });

  const dead = state.cards.filter(c=>c.dead && cardMatchesFilter(c));
  document.getElementById('archiveToggle').textContent = '▸ Didn\'t pan out (' + dead.length + ')';
  const archiveEl = document.getElementById('archive');
  archiveEl.innerHTML = '';
  dead.forEach(c=>archiveEl.appendChild(cardEl(c)));
}

document.getElementById('archiveToggle').onclick = ()=>{
  const a = document.getElementById('archive');
  a.style.display = a.style.display==='none' ? 'block' : 'none';
};
document.getElementById('clearFilter').onclick = ()=>{
  activeFilters.clear(); searchQuery=''; tagFilterQuery=''; tagFilterExpanded=false;
  document.getElementById('searchInput').value=''; document.getElementById('tagSearchInput').value='';
  render();
};
document.getElementById('searchInput').addEventListener('input', e=>{ searchQuery = e.target.value; render(); });
document.getElementById('tagSearchInput').addEventListener('input', e=>{ tagFilterQuery = e.target.value; tagFilterExpanded = false; render(); });

document.getElementById('quickAdd').onclick = quickAdd;
document.getElementById('quickInput').addEventListener('keydown', e=>{ if(e.key==='Enter') quickAdd(); });
function quickAdd(){

  if(!title) return;
  const c = makeCard({title});

function openModal(id){

  renderModal();

}
function closeModal(){
